<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>لوحة تحكم Nacer_22</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    :root {
        --primary: #e50914;
        --primary-hover: #ff1a25;
        --bg-dark: #050000;
        --card-bg: rgba(20, 5, 5, 0.7);
        --border-color: rgba(229, 9, 20, 0.3);
        --text-main: #ffffff;
        --text-muted: #aaaaaa;
        --success: #22c55e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
    
    body { 
        background-color: var(--bg-dark);
        background-image: radial-gradient(circle at 50% 0%, rgba(139, 0, 0, 0.3) 0%, transparent 60%);
        color: var(--text-main); 
        display: flex; 
        justify-content: center; 
        align-items: flex-start;
        min-height: 100vh; 
        padding: 15px; 
        padding-top: 30px;
    }

    .container { 
        width: 100%; max-width: 800px; 
        background: var(--card-bg); 
        backdrop-filter: blur(10px);
        padding: 25px 20px; 
        border-radius: 16px; 
        border: 1px solid var(--border-color); 
        text-align: center; 
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 20px rgba(229, 9, 20, 0.1);
    }
    
    img.logo { 
        width: 100px; height: 100px; border-radius: 50%; 
        border: 3px solid var(--primary); 
        box-shadow: 0 0 20px rgba(229, 9, 20, 0.4); 
        margin-bottom: 15px; object-fit: cover;
    }
    
    h1 { color: var(--text-main); font-size: 24px; margin-bottom: 25px; font-weight: 900; letter-spacing: 1px;}
    h1 span { color: var(--primary); }

    .card { 
        background: rgba(0, 0, 0, 0.4); 
        padding: 20px; 
        border-radius: 12px; 
        margin-bottom: 20px; 
        border: 1px solid #222;
        transition: 0.3s;
    }
    .card:hover { border-color: #333; }

    /* تنسيق موحد للخانات والقائمة المنسدلة */
    input, select { 
        width: 100%; padding: 14px; margin: 5px 0; 
        border-radius: 8px; border: 1px solid #333; 
        background: #000; color: #fff; 
        font-size: 16px; outline: none; transition: 0.3s;
        font-family: 'Cairo', sans-serif;
    }
    
    input:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 15px rgba(229,9,20,0.2); }
    
    button { 
        width: 100%; padding: 14px; margin: 8px 0; 
        border-radius: 8px; border: none; 
        background: linear-gradient(135deg, var(--primary) 0%, #8b0000 100%); 
        color: #fff; font-weight: bold; font-size: 16px; cursor: pointer; 
        transition: 0.3s;
        display: flex; justify-content: center; align-items: center; gap: 10px;
        box-shadow: 0 4px 15px rgba(229, 9, 20, 0.3);
    }
    
    button:hover { background: linear-gradient(135deg, var(--primary-hover) 0%, #a00000 100%); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(229, 9, 20, 0.5); }
    button:active { transform: translateY(0); }
    button:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .btn-danger { background: linear-gradient(135deg, #333 0%, #111 100%); border: 1px solid #444; box-shadow: none; }
    .btn-danger:hover { background: #442222; border-color: var(--primary); }

    /* تقسيم الصفوف */
    .row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 5px; }
    .row input { flex: 1; text-align: center; }
    .row select { flex: 0 0 100px; text-align: center; cursor: pointer; }

    /* تصميم الجدول */
    .table-wrapper { overflow-x: auto; margin-top: 20px; border-radius: 8px; border: 1px solid #222; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; white-space: nowrap; }
    th, td { padding: 14px 10px; border-bottom: 1px solid #222; text-align: center; }
    th { background: rgba(229, 9, 20, 0.1); color: var(--primary); font-weight: 900; }
    tr:last-child td { border-bottom: none; }
    tr:hover { background: rgba(255, 255, 255, 0.02); }
    
    .code-cell { font-family: monospace; font-size: 15px; color: #ffcc00; font-weight: bold; }
    
    .action-group { display: flex; gap: 5px; justify-content: center; }
    .action-btn { 
        padding: 8px 12px; border-radius: 6px; border: none; font-size: 12px; font-weight: bold; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 5px;
    }
    .action-btn:hover { transform: scale(1.05); }
    .btn-copy { background: #1e3a8a; color: #fff; }
    .btn-copy:hover { background: #2563eb; }
    .btn-reset { background: #854d0e; color: #fff; }
    .btn-reset:hover { background: #ca8a04; }
    .btn-del { background: #7f1d1d; color: #fff; }
    .btn-del:hover { background: #b91c1c; }

    /* إشعارات */
    #toast { 
        position: fixed; bottom: -100px; left: 50%; transform: translateX(-50%); 
        background: #222; color: #fff; padding: 15px 25px; border-radius: 8px; 
        font-weight: bold; transition: 0.4s; z-index: 1000; 
        box-shadow: 0 5px 15px rgba(0,0,0,0.5); border-right: 4px solid var(--success);
        display: flex; align-items: center; gap: 10px;
    }
    #toast.show { bottom: 30px; }
    #toast.error { border-right-color: var(--primary); }

    /* لودر */
    .fa-spinner { animation: spin 1s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    .header-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .header-title h3 { color: #fff; font-size: 18px; }
</style>
</head>
<body>

<div class="container">
    <img src="https://i.imgur.com/kf1AmpO.png" alt="Logo" class="logo">
    <h1>Control panel <span>Nacer_22</span></h1>

    <!-- قسم تسجيل الدخول -->
    <div class="card" id="auth-section">
        <input type="password" id="token" placeholder="أدخل الرمز السري (Admin Token)">
        <button onclick="loadCodes()" id="btn-load">
            <i class="fa-solid fa-download"></i> تحميل الأكواد
        </button>
    </div>

    <!-- قسم إنشاء الأكواد -->
    <div class="card" id="create-section" style="display: none;">
        <!-- الصف الأول: المدة ووحدة القياس -->
        <div class="row">
            <input type="number" id="dur" value="24" placeholder="المدة" min="1">
            <select id="time_unit">
                <option value="hours">ساعة</option>
                <option value="minutes">دقيقة</option>
            </select>
        </div>
        <!-- الصف الثاني: الأجهزة والعدد -->
        <div class="row">
            <input type="number" id="dev" value="1" placeholder="عدد الأجهزة" min="1">
            <input type="number" id="cnt" value="1" placeholder="عدد الأكواد" min="1">
        </div>
        <button onclick="createCode()" id="btn-create">
            <i class="fa-solid fa-plus"></i> إنشاء الأكواد
        </button>
    </div>

    <!-- قسم الجدول -->
    <div id="table-section" style="display: none;">
        <div class="header-title">
            <h3><i class="fa-solid fa-list"></i> الأكواد المسجلة</h3>
            <button class="btn-danger action-btn" onclick="deleteAllCodes()" style="width: auto; padding: 8px 15px; font-size: 13px;">
                <i class="fa-solid fa-trash"></i> حذف الكل
            </button>
        </div>
        
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr><th>ID</th><th>الكود</th><th>المدة</th><th>الحالة</th><th>إجراءات</th></tr>
                </thead>
                <tbody id="tbody"></tbody>
            </table>
        </div>
    </div>
</div>

<!-- إشعار -->
<div id="toast">
    <i class="fa-solid fa-circle-check" id="toast-icon"></i>
    <span id="toast-text">تم بنجاح!</span>
</div>

<script>
    const API = "https://key-system-yn0o.onrender.com"; 
    const tk = () => document.getElementById('token').value;
    
    function showToast(msg, isError = false) {
        const toast = document.getElementById('toast');
        const icon = document.getElementById('toast-icon');
        const text = document.getElementById('toast-text');
        
        text.innerText = msg;
        if(isError) {
            toast.classList.add('error');
            icon.className = 'fa-solid fa-circle-exclamation';
        } else {
            toast.classList.remove('error');
            icon.className = 'fa-solid fa-circle-check';
        }
        
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3000);
    }

    function setLoading(btnId, isLoading) {
        const btn = document.getElementById(btnId);
        if(isLoading) {
            btn.disabled = true;
            btn.dataset.oldText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner"></i> جاري المعالجة...';
        } else {
            btn.disabled = false;
            btn.innerHTML = btn.dataset.oldText;
        }
    }

    // دالة مساعدة لعرض المدة بشكل جميل
    function formatDuration(hours) {
        if (hours < 1) {
            return Math.round(hours * 60) + ' دقيقة';
        }
        return hours + ' ساعة';
    }

    // تحميل الأكواد
    async function loadCodes() {
        if(!tk()) return showToast("الرجاء إدخال الرمز السري أولاً", true);
        
        setLoading('btn-load', true);
        try {
            const r = await fetch(API + '/api/admin/codes', { headers: {'x-admin-token': tk()} });
            
            if(r.status === 403) {
                showToast("الرمز السري خاطئ!", true);
                setLoading('btn-load', false);
                return;
            }
            
            const rows = await r.json();
            
            document.getElementById('auth-section').style.display = 'none';
            document.getElementById('create-section').style.display = 'block';
            document.getElementById('table-section').style.display = 'block';
            
            renderTable(rows);
            showToast("تم تحميل الأكواد بنجاح");
        } catch(err) {
            showToast("خطأ في الاتصال بالسيرفر", true);
        } finally {
            setLoading('btn-load', false);
        }
    }

    // عرض الجدول
    function renderTable(rows) {
        const tbody = document.getElementById('tbody');
        tbody.innerHTML = '';
        
        if(rows.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" style="color:#888;">لا توجد أكواد حالياً</td></tr>';
            return;
        }

        rows.forEach(c => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>#${c.id}</td>
                <td class="code-cell">${c.code}</td>
                <td>${formatDuration(c.duration_hours)}</td>
                <td style="color:${c.is_active ? '#22c55e' : '#e50914'}; font-weight: bold;">
                    ${c.is_active ? 'مفعل' : 'معطل'}
                </td>
                <td>
                    <div class="action-group">
                        <button class="action-btn btn-copy" onclick="copyCode('${c.code}')" title="نسخ">
                            <i class="fa-regular fa-copy"></i>
                        </button>
                        <button class="action-btn btn-reset" onclick="resetDevice(${c.id})" title="إعادة تعيين الأجهزة">
                            <i class="fa-solid fa-rotate-right"></i>
                        </button>
                        <button class="action-btn btn-del" onclick="del(${c.id})" title="حذف">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    // نسخ الكود
    function copyCode(code) {
        navigator.clipboard.writeText(code).then(() => {
            showToast("تم نسخ الكود: " + code);
        });
    }

    // إنشاء كود (مع التحويل بين الساعات والدقائق)
    async function createCode() {
        setLoading('btn-create', true);
        
        const durationValue = +document.getElementById('dur').value;
        const timeUnit = document.getElementById('time_unit').value;
        
        // تحويل الدقائق إلى ساعات للـ API
        let durationInHours = durationValue;
        if (timeUnit === 'minutes') {
            durationInHours = durationValue / 60;
        }

        const body = { 
            duration_hours: durationInHours, // السيرفر يفهم الكسور (0.5 = 30 دقيقة)
            max_devices: +document.getElementById('dev').value, 
            count: +document.getElementById('cnt').value 
        };
        
        try {
            const r = await fetch(API + '/api/admin/codes', { 
                method: 'POST', 
                headers: {'Content-Type': 'application/json', 'x-admin-token': tk()}, 
                body: JSON.stringify(body) 
            });
            
            if(r.ok) {
                showToast("تم إنشاء الأكواد بنجاح");
                loadCodes();
            } else {
                showToast("حدث خطأ أثناء الإنشاء", true);
            }
        } catch(err) {
            showToast("خطأ في الاتصال", true);
        } finally {
            setLoading('btn-create', false);
        }
    }

    // إعادة تعيين الجهاز
    async function resetDevice(id) {
        if(!confirm("هل أنت متأكد من إعادة تعيين هذا المفتاح؟ سيتم فصل الأجهزة المرتبطة به.")) return;
        
        try {
            const r = await fetch(API + '/api/admin/codes/' + id + '/reset', { 
                method: 'DELETE', 
                headers: {'x-admin-token': tk()} 
            });
            if(r.ok) {
                showToast("تم إعادة تعيين المفتاح بنجاح");
                loadCodes();
            }
        } catch(err) {
            showToast("حدث خطأ", true);
        }
    }

    // حذف كود فردي
    async function del(id) {
        if(!confirm("هل أنت متأكد من حذف هذا الكود نهائياً؟")) return;
        
        try {
            await fetch(API + '/api/admin/codes/' + id, { 
                method: 'DELETE', 
                headers: {'x-admin-token': tk()} 
            });
            showToast("تم حذف الكود");
            loadCodes();
        } catch(err) {
            showToast("حدث خطأ", true);
        }
    }

    // حذف كل الأكواد
    async function deleteAllCodes() {
        if(!confirm("تحذير: سيتم حذف جميع الأكواد نهائياً! هل أنت متأكد؟")) return;
        
        try {
            const r = await fetch(API + '/api/admin/codes', { headers: {'x-admin-token': tk()} });
            const rows = await r.json();
            
            for (let c of rows) {
                await fetch(API + '/api/admin/codes/' + c.id, { 
                    method: 'DELETE', 
                    headers: {'x-admin-token': tk()} 
                });
            }
            showToast("تم حذف جميع الأكواد");
            loadCodes();
        } catch (err) {
            showToast("حدث خطأ أثناء الحذف", true);
        }
    }
</script>
</body>
</html>
