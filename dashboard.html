<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Control panel Nacer_22</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    :root {
        --primary-red: #e50914;
        --primary-hover: #ff1a25;
        --dark-red: #8b0000;
        --bg-dark: #050000;
        --card-bg: rgba(15, 5, 5, 0.85);
        --gold: #ffcc00;
        --text-main: #ffffff;
        --text-muted: #9ca3af;
        --success: #22c55e;
        --error: #ef4444;
        --info: #3b82f6;
        --border-color: rgba(229, 9, 20, 0.2);
        --sidebar-width: 260px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
    
    body { 
        background-color: var(--bg-dark); color: var(--text-main); 
        min-height: 100vh; font-size: 14px; line-height: 1.5; overflow-x: hidden;
    }

    /* ============ شاشة الدخول ============ */
    #login-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
        background-color: var(--bg-dark);
        background-image: radial-gradient(circle at 50% 0%, rgba(139, 0, 0, 0.25) 0%, transparent 60%);
        display: flex; justify-content: center; align-items: center;
        z-index: 9999; transition: opacity 0.4s ease;
    }
    
    .login-box {
        background: linear-gradient(145deg, #110202, #050000);
        border: 1px solid var(--primary-red); border-radius: 16px;
        padding: 40px 30px; width: 90%; max-width: 380px;
        text-align: center;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8), 0 0 25px rgba(229, 9, 20, 0.2);
    }
    
    .login-box img { width: 80px; height: 80px; border-radius: 50%; border: 2px solid var(--primary-red); box-shadow: 0 0 15px rgba(229, 9, 20, 0.4); margin-bottom: 15px; background: #000; object-fit: cover; }
    .login-box h2 { font-size: 22px; font-weight: 900; margin-bottom: 5px; }
    .login-box h2 span { color: var(--primary-red); }
    .login-box p { color: var(--text-muted); font-size: 14px; margin-bottom: 25px; }

    .login-input-group {
        display: flex; align-items: center; background: #000; border: 1px solid #333;
        border-radius: 8px; padding: 5px 15px; margin-bottom: 10px; transition: 0.3s;
    }
    .login-input-group:focus-within { border-color: var(--primary-red); box-shadow: 0 0 10px rgba(229, 9, 20, 0.3); }
    .login-input-group i { color: var(--primary-red); margin-left: 10px; font-size: 16px; }
    .login-input-group input { 
        flex: 1; background: transparent; border: none; color: #fff; 
        padding: 12px 0; outline: none; font-size: 16px; text-align: center; letter-spacing: 2px; 
    }

    .login-error { color: var(--error); font-size: 13px; font-weight: bold; margin-bottom: 15px; display: none; }
    .login-error.show { display: block; }

    .login-box button {
        width: 100%; padding: 14px; border-radius: 8px; border: none;
        background: linear-gradient(180deg, var(--primary-red) 0%, var(--dark-red) 100%);
        color: #fff; font-weight: 900; font-size: 16px; cursor: pointer;
        box-shadow: 0 4px 15px rgba(229, 9, 20, 0.3); transition: 0.3s;
        display: flex; justify-content: center; align-items: center; gap: 8px;
    }
    .login-box button:hover { background: linear-gradient(180deg, var(--primary-hover) 0%, #a00000 100%); transform: translateY(-2px); }

    /* ============ لوحة التحكم ============ */
    #dashboard-layout { display: none; min-height: 100vh; }
    .app-layout { display: flex; min-height: 100vh; }

    .sidebar {
        width: var(--sidebar-width); background: rgba(10, 2, 2, 0.95);
        border-left: 1px solid var(--border-color); display: flex; flex-direction: column;
        padding: 20px 0; position: fixed; top: 0; right: 0; bottom: 0; z-index: 100;
    }
    .brand-section { display: flex; flex-direction: column; align-items: center; padding: 0 20px 20px 20px; border-bottom: 1px solid rgba(255,255,255,0.05); margin-bottom: 20px; }
    .brand-section img { width: 70px; height: 70px; border-radius: 50%; border: 2px solid var(--primary-red); box-shadow: 0 0 15px rgba(229, 9, 20, 0.4); margin-bottom: 10px; background: #000; object-fit: cover; }
    .brand-section h1 { font-size: 20px; font-weight: 900; color: #fff; text-align: center;}
    .brand-section h1 span { color: var(--primary-red); }

    .nav-menu { display: flex; flex-direction: column; gap: 5px; padding: 0 15px; }
    .nav-item {
        display: flex; align-items: center; gap: 12px; padding: 12px 15px; border-radius: 8px;
        color: var(--text-muted); text-decoration: none; font-weight: 700; font-size: 14px; transition: all 0.3s;
    }
    .nav-item:hover, .nav-item.active { background: rgba(229, 9, 20, 0.1); color: #fff; border-right: 3px solid var(--primary-red); }
    .nav-item i { width: 20px; text-align: center; font-size: 16px; }

    .main-content {
        flex: 1; margin-right: var(--sidebar-width); padding: 25px 30px;
        background-image: radial-gradient(circle at 50% 0%, rgba(139, 0, 0, 0.1) 0%, transparent 60%);
        display: flex; flex-direction: column; gap: 25px;
    }

    .panel-card { background: var(--card-bg); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 12px; padding: 25px; box-shadow: 0 8px 25px rgba(0,0,0,0.5); }
    .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid rgba(229, 9, 20, 0.15); }
    .panel-title { font-size: 18px; font-weight: 900; color: #fff; display: flex; align-items: center; gap: 10px; }
    .panel-title i { color: var(--primary-red); }

    .create-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 15px; align-items: end; }
    .input-group { display: flex; flex-direction: column; gap: 8px; }
    .input-group label { font-size: 13px; color: var(--text-muted); font-weight: 700; }
    
    input, select { width: 100%; padding: 12px 15px; border-radius: 8px; border: 1px solid #333; background: #0a0a0a; color: #fff; font-size: 14px; outline: none; font-family: 'Cairo', sans-serif; transition: all 0.3s ease; }
    input:focus, select:focus { border-color: var(--primary-red); box-shadow: 0 0 10px rgba(229, 9, 20, 0.2); }

    button { padding: 12px 20px; border-radius: 8px; border: none; background: linear-gradient(180deg, var(--primary-red) 0%, var(--dark-red) 100%); color: #fff; font-weight: 900; font-size: 14px; cursor: pointer; transition: all 0.2s ease; display: inline-flex; justify-content: center; align-items: center; gap: 8px; box-shadow: 0 4px 15px rgba(229, 9, 20, 0.3); }
    button:hover:not(:disabled) { background: linear-gradient(180deg, var(--primary-hover) 0%, #a00000 100%); transform: translateY(-2px); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .key-list { display: flex; flex-direction: column; gap: 10px; }
    .key-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; background: rgba(0, 0, 0, 0.4); border: 1px solid #222; border-radius: 8px; padding: 12px 15px; gap: 15px; transition: 0.3s; }
    .key-row:hover { border-color: rgba(229, 9, 20, 0.3); background: rgba(20, 5, 5, 0.6); }
    .key-main-info { display: flex; align-items: center; gap: 15px; flex: 1; min-width: 200px;}
    .key-code { font-family: monospace; font-size: 16px; color: var(--gold); font-weight: 900; direction: ltr; }
    .key-badge { padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; }
    .badge-active { background: rgba(34, 197, 94, 0.15); color: var(--success); border: 1px solid rgba(34, 197, 94, 0.3); }
    .badge-disabled { background: rgba(239, 68, 68, 0.15); color: var(--error); border: 1px solid rgba(239, 68, 68, 0.3); }
    .key-stats { display: flex; gap: 20px; font-size: 13px; color: var(--text-muted); flex-wrap: wrap; }
    .key-stats span { display: flex; align-items: center; gap: 6px; }
    .key-actions { display: flex; gap: 8px; }
    .key-actions button { padding: 8px 12px; font-size: 13px; border-radius: 6px; }
    .btn-blue { background: #1e3a8a; border: 1px solid #3b82f6; box-shadow: none; }
    .btn-blue:hover:not(:disabled) { background: #2563eb; }
    .btn-gold { background: #854d0e; border: 1px solid #eab308; box-shadow: none; }
    .btn-gold:hover:not(:disabled) { background: #ca8a04; }
    .btn-del { background: #7f1d1d; border: 1px solid #ef4444; box-shadow: none; }
    .btn-del:hover:not(:disabled) { background: #b91c1c; }
    .btn-dark { background: #333; border: 1px solid #444; box-shadow: none; }
    .btn-dark:hover:not(:disabled) { background: #444; }

    .search-input { max-width: 100%; position: relative; margin-bottom: 20px; }
    .search-input input { padding-right: 40px; }
    .search-input i { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: #666; }

    #status-msg { color: var(--success); font-weight: bold; display: none; font-size: 14px; padding: 15px; border-radius: 8px; background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.2); text-align: center; }

    @media (max-width: 768px) {
        .app-layout { flex-direction: column; }
        .sidebar { position: relative; width: 100%; height: auto; flex-direction: row; padding: 10px 15px; border-left: none; border-bottom: 1px solid var(--border-color); justify-content: space-between; align-items: center; }
        .brand-section { flex-direction: row; padding: 0; border: none; margin: 0; gap: 10px; }
        .brand-section img { width: 40px; height: 40px; margin: 0; border-width: 1px; }
        .brand-section h1 { font-size: 16px; text-align: right; }
        .nav-menu { display: none; }
        .main-content { margin-right: 0; padding: 15px; }
        .key-row { flex-direction: column; align-items: flex-start; gap: 12px; padding: 15px; }
        .key-main-info { width: 100%; justify-content: space-between; }
        .key-stats { width: 100%; justify-content: space-between; padding-top: 12px; border-top: 1px dashed #333; }
        .key-actions { width: 100%; justify-content: flex-end; }
        .key-actions button { flex: 1; }
        .create-form { grid-template-columns: 1fr 1fr; }
        .create-form button { grid-column: span 2; }
        .login-box { padding: 30px 20px; }
    }
    .fa-spinner { animation: spin 1s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="login-overlay">
    <div class="login-box">
        <img src="https://i.imgur.com/kf1AmpO.png" alt="Logo">
        <h2>Control <span>Nacer_22</span></h2>
        <p>تسجيل الدخول إلى لوحة التحكم</p>
        
        <div class="login-input-group">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="tokenInput" placeholder="أدخل كلمة المرور" onkeypress="handleKeyPress(event)">
        </div>
        
        <div class="login-error" id="login-error">كلمة المرور غير صحيحة!</div>
        
        <button onclick="login()" id="btn-login">
            <i class="fa-solid fa-right-to-bracket"></i> دخول
        </button>
    </div>
</div>

<div id="dashboard-layout">
    <div class="app-layout">
        <aside class="sidebar">
            <div class="brand-section">
                <img src="https://i.imgur.com/kf1AmpO.png" alt="Logo">
                <h1>Nacer_22</h1>
            </div>
            <div class="nav-menu">
                <a href="#" class="nav-item active"><i class="fa-solid fa-gauge-high"></i> لوحة التحكم</a>
                <a href="#" class="nav-item"><i class="fa-solid fa-key"></i> الأكواد</a>
                <a href="#" class="nav-item" onclick="logout()" style="color:var(--error); margin-top:auto;"><i class="fa-solid fa-right-from-bracket"></i> تسجيل خروج</a>
            </div>
        </aside>

        <main class="main-content">
            <div class="panel-card">
                <div class="panel-header">
                    <div class="panel-title"><i class="fa-solid fa-plus-circle"></i> إنشاء أكواد جديدة</div>
                </div>
                <div class="create-form">
                    <div class="input-group"><label>المدة</label><input type="number" id="dur" value="24" min="1"></div>
                    <div class="input-group"><label>الوحدة</label><select id="time_unit"><option value="hours">ساعة</option><option value="days">يوم</option><option value="weeks">أسبوع</option><option value="months">شهر</option></select></div>
                    <div class="input-group"><label>عدد المفاتيح</label><input type="number" id="cnt" value="1" min="1"></div>
                    <div class="input-group"><label>عدد الأجهزة</label><input type="number" id="dev" value="1" min="1"></div>
                    <div class="input-group"><button onclick="createCode()" id="btn-create" style="width:100%;"><i class="fa-solid fa-bolt"></i> إنشاء</button></div>
                </div>
            </div>

            <div class="panel-card">
                <div class="panel-header">
                    <div class="panel-title"><i class="fa-solid fa-list-ul"></i> الأكواد المسجلة</div>
                    <button class="btn-dark" style="padding: 8px 15px; font-size: 13px;" onclick="confirmDeleteAll()"><i class="fa-solid fa-trash"></i> حذف الكل</button>
                </div>
                
                <div class="search-input">
                    <input type="text" id="searchInput" placeholder="ابحث عن كود..." oninput="filterCodes()">
                    <i class="fa-solid fa-search"></i>
                </div>

                <div class="key-list" id="codes-container"></div>
            </div>
            <div id="status-msg"></div>
        </main>
    </div>
</div><script>
    const API = "https://key-system-yn0o.onrender.com"; 
    let allCodes = [];
    let authToken = sessionStorage.getItem('adminToken') || "";

    // التحقق عند فتح الصفحة (إذا كان هناك توكن صالح)
    window.onload = () => {
        if (authToken) {
            showDashboard();
            fetchCodes();
        }
    };

    function handleKeyPress(e) {
        if (e.key === 'Enter') login();
    }

    // دالة الدخول (ترسل الطلب للسيرفر)
    async function login() {
        const inputVal = document.getElementById('tokenInput').value.trim();
        const errorMsg = document.getElementById('login-error');
        const btn = document.getElementById('btn-login');
        const originalText = btn.innerHTML;

        if (!inputVal) {
            errorMsg.innerText = "يرجى إدخال كلمة المرور";
            errorMsg.classList.add('show');
            return;
        }

        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري التحقق...';
        errorMsg.classList.remove('show');

        try {
            const res = await fetch(`${API}/api/admin/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: inputVal })
            });

            if (res.ok) {
                const data = await res.json();
                authToken = data.token;
                sessionStorage.setItem('adminToken', authToken);
                showDashboard();
                fetchCodes();
            } else {
                errorMsg.innerText = "كلمة المرور غير صحيحة!";
                errorMsg.classList.add('show');
            }
        } catch (err) {
            errorMsg.innerText = "تعذر الاتصال بالسيرفر، يرجى المحاولة لاحقاً.";
            errorMsg.classList.add('show');
        } finally {
            btn.disabled = false;
            btn.innerHTML = originalText;
        }
    }

    function showDashboard() {
        document.getElementById('login-overlay').style.display = 'none';
        document.getElementById('dashboard-layout').style.display = 'block';
    }

    function logout() {
        sessionStorage.removeItem('adminToken');
        authToken = "";
        window.location.reload();
    }

    function showMsg(msg, isError = false) {
        const status = document.getElementById('status-msg');
        status.innerText = msg;
        status.style.color = isError ? "var(--error)" : "var(--success)";
        status.style.background = isError ? "rgba(239,68,68,0.1)" : "rgba(34,197,94,0.1)";
        status.style.borderColor = isError ? "rgba(239,68,68,0.2)" : "rgba(34,197,94,0.2)";
        status.style.display = 'block';
        setTimeout(() => { status.style.display = 'none'; }, 4000);
    }

    // دالة مساعدة لإضافة هيدر التوكن
    function getHeaders() {
        return {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${authToken}`
        };
    }

    async function fetchCodes() {
        try {
            const res = await fetch(`${API}/api/admin/codes`, { headers: getHeaders() });
            
            if (res.status === 401 || res.status === 403) {
                logout(); // إذا انتهت الجلسة، سجل الخروج
                return;
            }
            
            if(res.ok) {
                allCodes = await res.json();
                renderCodes(allCodes);
            }
        } catch(err) {
            showMsg("تعذر جلب البيانات (السيرفر قد يكون نائماً).", true);
        }
    }

    function renderCodes(codesToRender) {
        const container = document.getElementById('codes-container');
        container.innerHTML = '';

        if (codesToRender.length === 0) {
            container.innerHTML = '<div style="text-align:center; color:#666; padding:20px; font-weight:bold;">لا توجد أكواد حالياً</div>';
            return;
        }

        codesToRender.forEach(c => {
            let durationText = c.duration_hours >= 1 ? `${c.duration_hours} ساعة` : `${Math.round(c.duration_hours * 60)} دقيقة`;
            let isActive = c.is_active === 1;
            let badgeClass = isActive ? 'badge-active' : 'badge-disabled';
            let badgeText = isActive ? 'مفعل' : 'معطل';

            const card = document.createElement('div');
            card.className = 'key-row';
            card.innerHTML = `
                <div class="key-main-info">
                    <div class="key-code">${c.code}</div>
                    <div class="key-badge ${badgeClass}">${badgeText}</div>
                </div>
                <div class="key-stats">
                    <span><i class="fa-regular fa-clock"></i> ${durationText}</span>
                    <span><i class="fa-solid fa-mobile-screen"></i> أجهزة: ${c.max_devices}</span>
                    <span><i class="fa-solid fa-users"></i> مستخدم: ${c.used}</span>
                </div>
                <div class="key-actions">
                    <button class="btn-blue" onclick="copyCode('${c.code}')" title="نسخ"><i class="fa-regular fa-copy"></i></button>
                    <button class="btn-gold" onclick="resetDevice(${c.id})" title="ريسيت"><i class="fa-solid fa-rotate-right"></i></button>
                    <button class="btn-del" onclick="deleteCode(${c.id})" title="حذف"><i class="fa-solid fa-trash"></i></button>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function filterCodes() {
        const term = document.getElementById('searchInput').value.toLowerCase();
        const filtered = allCodes.filter(c => c.code.toLowerCase().includes(term));
        renderCodes(filtered);
    }

    async function createCode() {
        const btn = document.getElementById('btn-create');
        const originalHTML = btn.innerHTML;
        
        const dur = +document.getElementById('dur').value;
        const unit = document.getElementById('time_unit').value;
        const count = +document.getElementById('cnt').value;
        const devices = +document.getElementById('dev').value;

        if(dur <= 0 || count <= 0 || devices <= 0) {
            return showMsg("يرجى إدخال قيم صحيحة أكبر من صفر", true);
        }

        let hours = dur;
        if (unit === 'days') hours *= 24;
        if (unit === 'weeks') hours *= 168;
        if (unit === 'months') hours *= 720;

        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';

        try {
            const res = await fetch(`${API}/api/admin/codes`, { 
                method: 'POST', 
                headers: getHeaders(), 
                body: JSON.stringify({ duration_hours: hours, max_devices: devices, count: count }) 
            });
            
            if(res.ok) {
                showMsg(`تم إنشاء ${count} مفاتيح بنجاح`);
                document.getElementById('cnt').value = "1";
                fetchCodes();
            } else if (res.status === 401 || res.status === 403) {
                logout();
            } else {
                showMsg("حدث خطأ أثناء الإنشاء", true);
            }
        } catch(err) {
            showMsg("تعذر الاتصال بالسيرفر", true);
        } finally {
            btn.disabled = false;
            btn.innerHTML = originalHTML;
        }
    }

    function copyCode(code) {
        navigator.clipboard.writeText(code).then(() => {
            showMsg("تم نسخ الكود: " + code);
        });
    }

    async function deleteCode(id) {
        if(!confirm("هل أنت متأكد من حذف هذا الكود؟")) return;
        try {
            const res = await fetch(`${API}/api/admin/codes/${id}`, { method: 'DELETE', headers: getHeaders() });
            if (res.status === 401 || res.status === 403) { logout(); return; }
            if(res.ok) fetchCodes();
        } catch(e) { showMsg("حدث خطأ", true); }
    }

    async function resetDevice(id) {
        if(!confirm("هل أنت متأكد من إعادة تعيين هذا المفتاح (فصل الأجهزة)؟")) return;
        try {
            const res = await fetch(`${API}/api/admin/codes/${id}/reset`, { method: 'DELETE', headers: getHeaders() });
            if (res.status === 401 || res.status === 403) { logout(); return; }
            if(res.ok) showMsg("تم إعادة التعيين بنجاح");
        } catch(e) { showMsg("حدث خطأ", true); }
    }

    async function confirmDeleteAll() {
        if(!confirm("تحذير: سيتم حذف جميع الأكواد نهائياً! هل أنت متأكد؟")) return;
        try {
            const res = await fetch(`${API}/api/admin/codes`, { headers: getHeaders() });
            if (res.status === 401 || res.status === 403) { logout(); return; }
            
            const rows = await res.json();
            for (let c of rows) {
                await fetch(`${API}/api/admin/codes/${c.id}`, { method: 'DELETE', headers: getHeaders() });
            }
            showMsg("تم حذف جميع الأكواد");
            fetchCodes();
        } catch(e) { showMsg("حدث خطأ أثناء الحذف", true); }
    }
</script>
</body>
</html>
