<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8"><title>لوحة تحكم الأكواد</title>
<style>
  body { font-family: sans-serif; background:#111; color:#eee; padding:20px; }
  input,button,select { padding:8px; margin:4px; border-radius:6px; border:none; }
  button { background:#2563eb; color:#fff; cursor:pointer; } button.danger{ background:#dc2626; }
  table { width:100%; border-collapse:collapse; margin-top:20px; }
  th,td { padding:8px; border-bottom:1px solid #333; text-align:center; }
  .active{color:#22c55e}.inactive{color:#ef4444}
</style>
</head>
<body>
<h2>🔑 لوحة الأكواد</h2>
<input id="token" placeholder="أدخل الرمز السري (Nacer_Nacer_22)" style="width:250px">
<button onclick="loadCodes()">تحميل الأكواد</button>
<hr>
<h3>إنشاء أكواد</h3>
<label>المدة (ساعات، 0=دائم):</label><input id="dur" type="number" value="24" style="width:80px">
<label>الأجهزة:</label><input id="dev" type="number" value="1" style="width:60px">
<label>العدد:</label><input id="cnt" type="number" value="1" style="width:60px">
<button onclick="createCode()">إنشاء الأكواد</button>

<!-- رسالة الحالة تظهر هنا بدلاً من النوافذ المزعجة -->
<div id="status" style="margin-top:15px; color:#fbbf24; font-weight:bold;"></div>

<table><thead><tr><th>ID</th><th>الكود</th><th>المدة</th><th>الأجهزة</th><th>مستخدم</th><th>الحالة</th><th>إجراء</th></tr></thead><tbody id="tbody"></tbody></table>

<script>
const API = "https://key-system-yn0o.onrender.com"; 
const tk = () => document.getElementById('token').value;
const st = document.getElementById('status');

async function createCode() {
  st.innerText = "جاري الإنشاء...";
  const body = { duration_hours: +document.getElementById('dur').value, max_devices: +document.getElementById('dev').value, count: +document.getElementById('cnt').value };
  try {
    const r = await fetch(API+'/api/admin/codes',{method:'POST',headers:{'Content-Type':'application/json','x-admin-token':tk()},body:JSON.stringify(body)});
    if(r.status === 403) { st.style.color = 'red'; st.innerText = "الرمز السري خاطئ!"; return; }
    const d = await r.json();
    if(d.created) {
        st.style.color = '#22c55e';
        st.innerText = "تم إنشاء الكود بنجاح!";
        loadCodes();
    } else {
        st.style.color = 'red';
        st.innerText = "خطأ: " + JSON.stringify(d);
    }
  } catch(e) {
    st.style.color = 'red';
    st.innerText = "خطأ في الاتصال بالسيرفر. قد يكون في وضع السكون، انتظر قليلاً وحاول مجدداً.";
  }
}

async function loadCodes() {
  st.innerText = "جاري التحميل...";
  try {
    const r = await fetch(API+'/api/admin/codes',{headers:{'x-admin-token':tk()}});
    if(r.status === 403) { st.style.color = 'red'; st.innerText = "الرمز السري خاطئ!"; return; }
    const rows = await r.json();
    st.innerText = "";
    if (rows.length === 0) {
        document.getElementById('tbody').innerHTML = '<tr><td colspan="7">لا توجد أكواد بعد.</td></tr>';
        return;
    }
    document.getElementById('tbody').innerHTML = rows.map(c=>`
      <tr><td>${c.id}</td><td><code>${c.code}</code></td><td>${c.duration_hours===0?'دائم':c.duration_hours+' س'}</td>
      <td>${c.max_devices}</td><td>${c.used}/${c.max_devices}</td>
      <td class="${c.is_active?'active':'inactive'}">${c.is_active?'مفعل':'معطل'}</td>
      <td><button onclick="toggle(${c.id},${c.is_active?0:1})">${c.is_active?'تعطيل':'تفعيل'}</button>
      <button class="danger" onclick="del(${c.id})">حذف</button></td></tr>`).join('');
  } catch(e) {
    st.style.color = 'red';
    st.innerText = "خطأ في الاتصال.";
  }
}

async function toggle(id,active){ 
    await fetch(API+'/api/admin/codes/'+id,{method:'PATCH',headers:{'Content-Type':'application/json','x-admin-token':tk()},body:JSON.stringify({is_active:active})}); 
    loadCodes(); 
}

async function del(id){ 
    if(confirm('هل أنت متأكد من حذف هذا الكود؟')){ 
        await fetch(API+'/api/admin/codes/'+id,{method:'DELETE',headers:{'x-admin-token':tk()}}); 
        loadCodes(); 
    } 
}
</script>
</body></html>
