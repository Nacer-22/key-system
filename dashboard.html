<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Control panel Nacer_22</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    /* ====== الألوان الأصلية (لم يتم تغييرها) ====== */
    :root {
        --primary-red: #e50914;
        --primary-hover: #ff1a25;
        --dark-red: #8b0000;
        --bg-dark: #050000;
        --card-bg: rgba(15, 5, 5, 0.85);
        --gold: #ffcc00;
        --text-main: #ffffff;
        --text-muted: #9ca3af;
        --success: #22c55e;
        --error: #ef4444;
        --info: #3b82f6;
        --border-color: rgba(229, 9, 20, 0.3);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
    
    body { 
        background-color: var(--bg-dark);
        background-image: radial-gradient(circle at 50% 0%, rgba(139, 0, 0, 0.2) 0%, transparent 60%);
        color: var(--text-main); 
        display: flex; justify-content: center; align-items: flex-start;
        min-height: 100vh; padding: 15px; padding-top: 25px;
        font-size: 14px; line-height: 1.5;
        overflow-x: hidden; /* منع التمرير الأفقي */
    }

    .container { 
        width: 100%; max-width: 850px; 
        background: var(--card-bg); 
        backdrop-filter: blur(12px);
        padding: 30px 20px; 
        border-radius: 16px; 
        border: 1px solid var(--border-color); 
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9), inset 0 0 20px rgba(229, 9, 20, 0.05);
        animation: fadeIn 0.5s ease-out;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    
    /* ====== الترويسة ====== */
    .header { display: flex; flex-direction: column; align-items: center; margin-bottom: 30px; }
    .logo-wrapper { position: relative; width: 90px; height: 90px; margin-bottom: 15px; display: flex; justify-content: center; align-items: center; }
    .logo-wrapper::before { content: ''; position: absolute; width: 100%; height: 100%; background: radial-gradient(circle, rgba(229, 9, 20, 0.4) 0%, transparent 70%); border-radius: 50%; filter: blur(12px); z-index: -1; }
    img.logo { width: 100%; height: 100%; border-radius: 50%; border: 2px solid var(--primary-red); object-fit: cover; box-shadow: 0 0 15px rgba(229, 9, 20, 0.5); background: #000; }
    h1 { color: var(--text-main); font-size: 24px; font-weight: 900; letter-spacing: 1px; text-align: center;}
    h1 span { color: var(--primary-red); text-shadow: 0 0 10px rgba(229, 9, 20, 0.5); }

    /* ====== قسم الدخول ====== */
    #login-section {
        background: rgba(0, 0, 0, 0.5); padding: 20px; border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.05); max-width: 400px; margin: 0 auto 20px auto;
        box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
    }
    .input-row { display: flex; gap: 10px; }
    
    /* ====== الحقول (Inputs) ====== */
    input, select { 
        width: 100%; padding: 13px 15px; border-radius: 8px; border: 1px solid #333; 
        background: #0a0a0a; color: #fff; font-size: 15px; outline: none; 
        font-family: 'Cairo', sans-serif; transition: all 0.3s ease;
    }
    input:focus, select:focus { 
        border-color: var(--primary-red); 
        box-shadow: 0 0 12px rgba(229, 9, 20, 0.25); 
        background: #000;
    }

    /* ====== الأزرار (Buttons) ====== */
    button { 
        padding: 13px 20px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); 
        background: linear-gradient(180deg, var(--primary-red) 0%, var(--dark-red) 100%); 
        color: #fff; font-weight: 900; font-size: 15px; cursor: pointer; 
        transition: all 0.3s ease; display: flex; justify-content: center; align-items: center; gap: 8px;
        box-shadow: 0 4px 15px rgba(229, 9, 20, 0.3);
    }
    button:hover:not(:disabled) { 
        background: linear-gradient(180deg, var(--primary-hover) 0%, #a00000 100%); 
        transform: translateY(-2px); box-shadow: 0 6px 20px rgba(229, 9, 20, 0.5); 
    }
    button:active:not(:disabled) { transform: translateY(0); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }

    /* ====== البطاقات (Cards) ====== */
    .card { 
        background: rgba(0, 0, 0, 0.4); padding: 20px; border-radius: 12px; 
        margin-bottom: 25px; border: 1px solid rgba(255, 255, 255, 0.05); 
        text-align: right; box-shadow: inset 0 0 20px rgba(0,0,0,0.3);
    }
    .card-title { 
        color: var(--primary-red); font-size: 17px; font-weight: 900; 
        margin-bottom: 20px; border-bottom: 1px solid rgba(229, 9, 20, 0.2); 
        padding-bottom: 10px; display: flex; align-items: center; justify-content: space-between; 
    }

    /* ====== شبكة حقول الإنشاء ====== */
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
    @media (min-width: 768px) { .form-grid { grid-template-columns: repeat(4, 1fr); } }
    
    .input-group { display: flex; flex-direction: column; gap: 8px; }
    .input-group label { font-size: 13px; color: var(--text-muted); font-weight: 700; }

    /* ====== قسم البحث ====== */
    .search-box { margin-bottom: 20px; position: relative; }
    .search-box input { padding-right: 15px; font-size: 14px; }
    
    /* ====== بطاقة الكود (Key Card) ====== */
    .key-card { 
        background: linear-gradient(145deg, rgba(25, 10, 10, 0.9), rgba(10, 5, 5, 0.9)); 
        border: 1px solid #2a2a2a; border-radius: 12px; 
        padding: 20px; margin-bottom: 15px; 
        display: flex; flex-direction: column; gap: 15px;
        transition: all 0.3s ease;
    }
    .key-card:hover { border-color: rgba(229, 9, 20, 0.4); box-shadow: 0 5px 20px rgba(229, 9, 20, 0.1); }

    .key-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .key-code { 
        font-family: monospace; font-size: 17px; color: var(--gold); 
        font-weight: 900; word-break: break-all; direction: ltr; text-align: right;
    }
    
    .key-badge { 
        padding: 5px 12px; border-radius: 6px; font-size: 12px; font-weight: bold; 
        display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
    }
    .badge-active { background: rgba(34, 197, 94, 0.15); color: var(--success); border: 1px solid rgba(34, 197, 94, 0.3); }
    .badge-disabled { background: rgba(239, 68, 68, 0.15); color: var(--error); border: 1px solid rgba(239, 68, 68, 0.3); }
    
    .key-info { 
        display: grid; grid-template-columns: 1fr 1fr; gap: 12px; 
        font-size: 13px; color: var(--text-muted); 
        background: rgba(0, 0, 0, 0.5); padding: 12px 15px; border-radius: 8px; 
    }
    @media (min-width: 600px) { .key-info { grid-template-columns: repeat(4, 1fr); } }
    .key-info span { display: flex; align-items: center; gap: 8px; }
    .key-info i { color: #666; font-size: 14px; width: 16px; text-align: center; }
    
    .key-actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .key-actions button { flex: 1; padding: 10px 0; font-size: 13px; border-radius: 6px; min-width: 80px; }
    
    /* ====== تخصيص الأزرار ====== */
    .btn-blue { background: #1e3a8a; border: 1px solid #3b82f6; box-shadow: 0 2px 10px rgba(37, 99, 235, 0.2); }
    .btn-blue:hover:not(:disabled) { background: #2563eb; box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4); }
    .btn-gold { background: #854d0e; border: 1px solid #eab308; box-shadow: 0 2px 10px rgba(234, 179, 8, 0.2); }
    .btn-gold:hover:not(:disabled) { background: #ca8a04; box-shadow: 0 4px 15px rgba(234, 179, 8, 0.4); }
    .btn-del { background: #7f1d1d; border: 1px solid #ef4444; box-shadow: 0 2px 10px rgba(239, 68, 68, 0.2); }
    .btn-del:hover:not(:disabled) { background: #b91c1c; box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4); }
    .btn-dark { background: #333; border: 1px solid #555; box-shadow: none; }
    .btn-dark:hover:not(:disabled) { background: #444; box-shadow: 0 4px 15px rgba(255,255,255,0.1); }

    /* ====== رسائل الحالة ====== */
    #status-msg { 
        color: var(--success); font-weight: bold; display: none; 
        margin-top: 15px; text-align: center; font-size: 14px; 
        padding: 12px; border-radius: 8px; background: rgba(34,197,94,0.1); 
        border: 1px solid rgba(34,197,94,0.2); 
    }
    
    .fa-spinner { animation: spin 1s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    .clear-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #666; cursor: pointer; }
</style>
</head>
<body>

<div class="container">
    <!-- الترويسة -->
    <div class="header">
        <div class="logo-wrapper">
            <img src="https://i.imgur.com/kf1AmpO.png" alt="Logo" class="logo">
        </div>
        <h1>Control panel <span>Nacer_22</span></h1>
    </div>

    <!-- 1. قسم الدخول -->
    <div id="login-section">
        <div class="input-row">
            <input type="password" id="tokenInput" placeholder="أدخل كلمة المرور (Admin Token)" onkeypress="handleKeyPress(event)">
            <button onclick="login()">دخول</button>
        </div>
        <div id="login-error" style="color:var(--error); font-size:13px; margin-top:10px; display:none; text-align:center; font-weight:bold;">كلمة المرور غير صحيحة!</div>
    </div>

    <!-- 2. محتوى لوحة التحكم -->
    <div id="dashboard-content" style="display: none;">
        
        <!-- إنشاء الأكواد -->
        <div class="card">
            <div class="card-title"><i class="fa-solid fa-plus-circle"></i> إنشاء مفاتيح جديدة</div>
            <div class="form-grid">
                <div class="input-group">
                    <label>مدة الصلاحية</label>
                    <input type="number" id="dur" value="24" min="1">
                </div>
                <div class="input-group">
                    <label>الوحدة</label>
                    <select id="time_unit">
                        <option value="hours">ساعة</option>
                        <option value="days">يوم</option>
                        <option value="weeks">أسبوع</option>
                        <option value="months">شهر</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>عدد المفاتيح</label>
                    <input type="number" id="cnt" value="1" min="1">
                </div>
                <div class="input-group">
                    <label>عدد الأجهزة</label>
                    <input type="number" id="dev" value="1" min="1">
                </div>
            </div>
            <button onclick="createCode()" id="btn-create" style="width:100%;"><i class="fa-solid fa-bolt"></i> إنشاء الأكواد الآن</button>
        </div>

        <!-- قائمة الأكواد -->
        <div class="card">
            <div class="card-title">
                <span><i class="fa-solid fa-list-ul"></i> الأكواد المسجلة</span>
                <button class="btn-dark" style="width: auto; padding: 6px 15px; font-size: 12px;" onclick="confirmDeleteAll()"><i class="fa-solid fa-trash"></i> حذف الكل</button>
            </div>
            
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="ابحث عن كود أو جزء منه..." oninput="filterCodes()">
                <i class="fa-solid fa-search clear-icon"></i>
            </div>

            <div id="codes-container">
                <!-- سيتم تعبئتها ديناميكياً -->
            </div>
        </div>

        <div id="status-msg"></div>
    </div>
</div>

<script>
    // ⚠️ لم يتم تغيير أي متغير أو رابط سيرفر ⚠️
    const API = "https://key-system-yn0o.onrender.com"; 
    const SECRET_PASSWORD = "Nacer_Nacer_22";
    let adminToken = "";
    let allCodes = [];

    function handleKeyPress(e) {
        if (e.key === 'Enter') login();
    }

    function login() {
        const inputVal = document.getElementById('tokenInput').value.trim();
        const errorMsg = document.getElementById('login-error');

        if (inputVal === SECRET_PASSWORD) {
            errorMsg.style.display = 'none';
            adminToken = inputVal;
            
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('dashboard-content').style.display = 'block';
            
            fetchCodes();
        } else {
            errorMsg.style.display = 'block';
        }
    }

    function showMsg(msg, isError = false) {
        const status = document.getElementById('status-msg');
        status.innerText = msg;
        status.style.color = isError ? "var(--error)" : "var(--success)";
        status.style.background = isError ? "rgba(239,68,68,0.1)" : "rgba(34,197,94,0.1)";
        status.style.borderColor = isError ? "rgba(239,68,68,0.2)" : "rgba(34,197,94,0.2)";
        status.style.display = 'block';
        setTimeout(() => { status.style.display = 'none'; }, 4000);
    }

    async function fetchCodes() {
        try {
            const res = await fetch(`${API}/api/admin/codes`, { headers: {'x-admin-token': adminToken} });
            if(res.ok) {
                allCodes = await res.json();
                renderCodes(allCodes);
            }
        } catch(err) {
            showMsg("تعذر جلب البيانات (السيرفر قد يكون نائماً).", true);
        }
    }

    function renderCodes(codesToRender) {
        const container = document.getElementById('codes-container');
        container.innerHTML = '';

        if (codesToRender.length === 0) {
            container.innerHTML = '<div style="text-align:center; color:#666; padding:30px; font-weight:bold;">لا توجد أكواد حالياً</div>';
            return;
        }

        codesToRender.forEach(c => {
            let durationText = c.duration_hours >= 1 ? `${c.duration_hours} ساعة` : `${Math.round(c.duration_hours * 60)} دقيقة`;
            let isActive = c.is_active === 1;
            let badgeClass = isActive ? 'badge-active' : 'badge-disabled';
            let badgeText = isActive ? 'مفعل' : 'معطل';

            const card = document.createElement('div');
            card.className = 'key-card';
            card.innerHTML = `
                <div class="key-header">
                    <div class="key-code">${c.code}</div>
                    <div class="key-badge ${badgeClass}">${badgeText}</div>
                </div>
                <div class="key-info">
                    <span><i class="fa-regular fa-clock"></i> المدة: ${durationText}</span>
                    <span><i class="fa-solid fa-mobile-screen"></i> الأجهزة: ${c.max_devices}</span>
                    <span><i class="fa-solid fa-users"></i> مستخدم: ${c.used}</span>
                    <span><i class="fa-solid fa-calendar"></i> ${new Date(c.created_at).toLocaleDateString('ar-EG')}</span>
                </div>
                <div class="key-actions">
                    <button class="btn-blue" onclick="copyCode('${c.code}')"><i class="fa-regular fa-copy"></i> نسخ</button>
                    <button class="btn-gold" onclick="resetDevice(${c.id})"><i class="fa-solid fa-rotate-right"></i> ريسيت</button>
                    <button class="btn-del" onclick="deleteCode(${c.id})"><i class="fa-solid fa-trash"></i> حذف</button>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function filterCodes() {
        const term = document.getElementById('searchInput').value.toLowerCase();
        const filtered = allCodes.filter(c => c.code.toLowerCase().includes(term));
        renderCodes(filtered);
    }

    async function createCode() {
        const btn = document.getElementById('btn-create');
        const originalHTML = btn.innerHTML;
        
        const dur = +document.getElementById('dur').value;
        const unit = document.getElementById('time_unit').value;
        const count = +document.getElementById('cnt').value;
        const devices = +document.getElementById('dev').value;

        if(dur <= 0 || count <= 0 || devices <= 0) {
            return showMsg("يرجى إدخال قيم صحيحة أكبر من صفر", true);
        }

        let hours = dur;
        if (unit === 'days') hours *= 24;
        if (unit === 'weeks') hours *= 168;
        if (unit === 'months') hours *= 720;

        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري الإنشاء...';

        try {
            const res = await fetch(`${API}/api/admin/codes`, { 
                method: 'POST', 
                headers: {'Content-Type': 'application/json', 'x-admin-token': adminToken}, 
                body: JSON.stringify({ duration_hours: hours, max_devices: devices, count: count }) 
            });
            
            if(res.ok) {
                showMsg(`تم إنشاء ${count} مفاتيح بنجاح`);
                document.getElementById('cnt').value = "1";
                fetchCodes();
            } else {
                showMsg("حدث خطأ أثناء الإنشاء", true);
            }
        } catch(err) {
            showMsg("تعذر الاتصال بالسيرفر", true);
        } finally {
            btn.disabled = false;
            btn.innerHTML = originalHTML;
        }
    }

    function copyCode(code) {
        navigator.clipboard.writeText(code).then(() => {
            showMsg("تم نسخ الكود: " + code);
        });
    }

    async function deleteCode(id) {
        if(!confirm("هل أنت متأكد من حذف هذا الكود؟")) return;
        try {
            await fetch(`${API}/api/admin/codes/${id}`, { method: 'DELETE', headers: {'x-admin-token': adminToken} });
            fetchCodes();
        } catch(e) { showMsg("حدث خطأ", true); }
    }

    async function resetDevice(id) {
        if(!confirm("هل أنت متأكد من إعادة تعيين هذا المفتاح (فصل الأجهزة)؟")) return;
        try {
            await fetch(`${API}/api/admin/codes/${id}/reset`, { method: 'DELETE', headers: {'x-admin-token': adminToken} });
            showMsg("تم إعادة التعيين بنجاح");
        } catch(e) { showMsg("حدث خطأ", true); }
    }

    async function confirmDeleteAll() {
        if(!confirm("تحذير: سيتم حذف جميع الأكواد نهائياً! هل أنت متأكد؟")) return;
        try {
            const res = await fetch(`${API}/api/admin/codes`, { headers: {'x-admin-token': adminToken} });
            const rows = await res.json();
            for (let c of rows) {
                await fetch(`${API}/api/admin/codes/${c.id}`, { method: 'DELETE', headers: {'x-admin-token': adminToken} });
            }
            showMsg("تم حذف جميع الأكواد");
            fetchCodes();
        } catch(e) { showMsg("حدث خطأ أثناء الحذف", true); }
    }
</script>
</body>
</html>
