<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Control panel Nacer_22</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    :root {
        --primary-red: #e50914;
        --primary-hover: #ff1a25;
        --dark-red: #8b0000;
        --bg-dark: #050000;
        --card-bg: rgba(15, 5, 5, 0.85);
        --gold: #ffcc00;
        --text-main: #ffffff;
        --text-muted: #888888;
        --success: #22c55e;
        --error: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
    
    body { 
        background-color: var(--bg-dark);
        background-image: radial-gradient(circle at 50% 0%, rgba(139, 0, 0, 0.2) 0%, transparent 60%);
        color: var(--text-main); 
        display: flex; justify-content: center; align-items: flex-start;
        min-height: 100vh; padding: 15px; padding-top: 30px;
    }

    .container { 
        width: 100%; max-width: 700px; 
        background: var(--card-bg); 
        backdrop-filter: blur(10px);
        padding: 25px 20px; 
        border-radius: 16px; 
        border: 1px solid rgba(229, 9, 20, 0.4); 
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(229, 9, 20, 0.1);
    }
    
    /* ترويسة الصفحة */
    .header-section {
        display: flex; flex-direction: column; align-items: center; margin-bottom: 25px;
    }
    .logo-wrapper {
        position: relative; width: 90px; height: 90px; margin-bottom: 15px;
        display: flex; justify-content: center; align-items: center;
    }
    .logo-wrapper::before {
        content: ''; position: absolute; width: 100%; height: 100%;
        background: radial-gradient(circle, rgba(229, 9, 20, 0.4) 0%, transparent 70%);
        border-radius: 50%; filter: blur(10px); z-index: -1;
    }
    .logo-wrapper img { 
        width: 100%; height: 100%; border-radius: 50%; border: 2px solid var(--primary-red);
        object-fit: cover; box-shadow: 0 0 15px rgba(229, 9, 20, 0.5);
    }

    h1 { color: var(--text-main); font-size: 22px; font-weight: 900; letter-spacing: 1px;}
    h1 span { color: var(--primary-red); text-shadow: 0 0 10px rgba(229, 9, 20, 0.5); }

    /* قسم الإنشاء */
    .card { 
        background: rgba(0, 0, 0, 0.4); 
        padding: 20px; 
        border-radius: 12px; 
        margin-bottom: 25px; 
        border: 1px solid rgba(255, 255, 255, 0.05);
    }
    
    .form-grid {
        display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px;
    }
    @media (min-width: 600px) {
        .form-grid { grid-template-columns: 1.5fr 1fr 1fr; }
    }

    .input-group { display: flex; flex-direction: column; gap: 8px; }
    .input-group label { font-size: 13px; color: var(--text-muted); font-weight: bold; }
    
    input, select { 
        width: 100%; padding: 12px; 
        border-radius: 8px; border: 1px solid #333; 
        background: #000; color: #fff; 
        font-size: 15px; outline: none; transition: 0.3s;
        font-family: 'Cairo', sans-serif;
    }
    input:focus, select:focus { border-color: var(--primary-red); box-shadow: 0 0 10px rgba(229, 9, 20, 0.2); }
    
    button { 
        width: 100%; padding: 14px; 
        border-radius: 8px; border: none; 
        background: linear-gradient(180deg, var(--primary-red) 0%, var(--dark-red) 100%); 
        color: #fff; font-weight: bold; font-size: 16px; cursor: pointer; 
        transition: 0.3s; display: flex; justify-content: center; align-items: center; gap: 8px;
        box-shadow: 0 4px 15px rgba(229, 9, 20, 0.3);
    }
    button:hover:not(:disabled) { background: linear-gradient(180deg, var(--primary-hover) 0%, #a00000 100%); transform: translateY(-2px); }
    button:active:not(:disabled) { transform: translateY(0); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }

    /* قسم الأكواد */
    .list-header {
        display: flex; flex-direction: column; gap: 15px; margin-bottom: 15px;
    }
    @media (min-width: 600px) {
        .list-header { flex-direction: row; justify-content: space-between; align-items: center; }
    }
    .list-title { color: #fff; font-size: 18px; font-weight: 900; display: flex; align-items: center; gap: 10px;}
    
    /* البحث والفلاتر */
    .controls { display: flex; flex-wrap: wrap; gap: 10px; }
    .search-box { flex: 1; min-width: 150px; position: relative; }
    .search-box input { padding-right: 35px; }
    .search-box i { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
    
    .filter-group { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 5px; }
    .filter-btn { 
        padding: 8px 15px; border-radius: 20px; border: 1px solid #333; 
        background: transparent; color: var(--text-muted); font-size: 12px; cursor: pointer;
    }
    .filter-btn.active { background: rgba(229, 9, 20, 0.2); border-color: var(--primary-red); color: #fff; }

    /* بطاقة الكود */
    .code-card {
        background: rgba(20, 20, 20, 0.8);
        border: 1px solid #333;
        border-radius: 10px;
        padding: 15px;
        margin-bottom: 12px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        transition: 0.3s;
    }
    .code-card:hover { border-color: rgba(229, 9, 20, 0.4); }

    /* تخطيط البطاقة للشاشات الكبيرة */
    @media (min-width: 600px) {
        .code-card { flex-direction: row; justify-content: space-between; align-items: center; padding: 15px 20px; }
    }

    .code-info { display: flex; flex-direction: column; gap: 5px; }
    .key-code { 
        font-family: monospace; font-size: 16px; color: var(--gold); font-weight: bold; 
        word-break: break-all; /* لحل مشكلة القطع */
    }
    .key-meta { display: flex; gap: 15px; font-size: 12px; color: var(--text-muted); }
    
    .status-badge {
        display: inline-flex; align-items: center; gap: 5px;
        padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: bold;
    }
    .status-active { background: rgba(34, 197, 94, 0.1); color: var(--success); border: 1px solid rgba(34, 197, 94, 0.2); }
    .status-disabled { background: rgba(239, 68, 68, 0.1); color: var(--error); border: 1px solid rgba(239, 68, 68, 0.2); }

    .actions { display: flex; gap: 8px; justify-content: flex-start; flex-wrap: wrap;}
    @media (min-width: 600px) { .actions { justify-content: flex-end; } }

    .action-btn { 
        padding: 8px 12px; border-radius: 6px; border: none; font-size: 12px; font-weight: bold; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 5px;
        width: auto;
    }
    .action-btn:active { transform: scale(0.95); }
    .btn-copy { background: #1e3a8a; color: #fff; border: 1px solid #3b82f6; }
    .btn-copy:hover { background: #2563eb; }
    .btn-reset { background: #854d0e; color: #fff; border: 1px solid #eab308; }
    .btn-reset:hover { background: #ca8a04; }
    .btn-del { background: #7f1d1d; color: #fff; border: 1px solid #ef4444; }
    .btn-del:hover { background: #b91c1c; }

    /* إشعارات */
    #toast { 
        position: fixed; bottom: -100px; left: 50%; transform: translateX(-50%); 
        background: #222; color: #fff; padding: 15px 25px; border-radius: 8px; 
        font-weight: bold; transition: 0.4s; z-index: 1000; 
        box-shadow: 0 5px 15px rgba(0,0,0,0.5); border-right: 4px solid var(--success);
        display: flex; align-items: center; gap: 10px;
    }
    #toast.show { bottom: 30px; }
    #toast.error { border-right-color: var(--primary-red); }

    /* لودر */
    .fa-spinner { animation: spin 1s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    /* حالة القائمة الفارغة */
    .empty-state { text-align: center; padding: 30px; color: var(--text-muted); font-size: 14px; }
</style>
</head>
<body>

<div class="container">
    <!-- الترويسة -->
    <div class="header-section">
        <div class="logo-wrapper">
            <img src="https://i.imgur.com/kf1AmpO.png" alt="Logo">
        </div>
        <h1>Control panel <span>Nacer_22</span></h1>
    </div>

    <!-- قسم الإنشاء -->
    <div class="card" id="create-section">
        <div class="form-grid">
            <div class="input-group">
                <label>مدة الصلاحية</label>
                <div style="display: flex; gap: 5px;">
                    <input type="number" id="dur" value="24" min="1" style="flex: 1;">
                    <select id="time_unit" style="flex: 1;">
                        <option value="hours">ساعة</option>
                        <option value="minutes">دقيقة</option>
                    </select>
                </div>
            </div>
            <div class="input-group">
                <label>عدد الأجهزة</label>
                <input type="number" id="dev" value="1" min="1" placeholder="الحد الأقصى">
            </div>
            <div class="input-group">
                <label>عدد الأكواد</label>
                <input type="number" id="cnt" value="1" min="1" placeholder="العدد">
            </div>
        </div>
        <button onclick="createCode()" id="btn-create">
            <i class="fa-solid fa-plus"></i> إنشاء الأكواد
        </button>
    </div>

    <!-- قسم القائمة -->
    <div id="list-section">
        <div class="list-header">
            <div class="list-title">
                <i class="fa-solid fa-list"></i> الأكواد المسجلة
            </div>
            <button class="action-btn btn-del" onclick="deleteAllCodes()" style="width: auto;">
                <i class="fa-solid fa-trash"></i> حذف الكل
            </button>
        </div>

        <!-- البحث والفلاتر -->
        <div class="controls">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="ابحث عن كود..." oninput="filterAndSearch()">
                <i class="fa-solid fa-search"></i>
            </div>
            <div class="filter-group">
                <button class="filter-btn active" onclick="setFilter('all')">الكل</button>
                <button class="filter-btn" onclick="setFilter('active')">مفعل</button>
                <button class="filter-btn" onclick="setFilter('disabled')">معطل</button>
            </div>
        </div>

        <!-- حاوية الأكواد -->
        <div id="codes-container" style="margin-top: 15px;">
            <!-- سيتم تعبئتها بالجافاسكريبت -->
        </div>
    </div>
</div>

<!-- إشعار -->
<div id="toast">
    <i class="fa-solid fa-circle-check" id="toast-icon"></i>
    <span id="toast-text">تم بنجاح!</span>
</div>

<script>
    // ⚠️ الاحتفاظ برابط السيرفر الأصلي ⚠️
    const API = "https://key-system-yn0o.onrender.com"; 
    const tk = () => localStorage.getItem('admin_token') || prompt("أدخل الرمز السري (Admin Token):");
    
    let allCodes = []; // لتخزين الأكواد للبحث والتصفية
    let currentFilter = 'all';

    // إعدادات الإشعارات
    function showToast(msg, isError = false) {
        const toast = document.getElementById('toast');
        const icon = document.getElementById('toast-icon');
        const text = document.getElementById('toast-text');
        
        text.innerText = msg;
        if(isError) {
            toast.classList.add('error');
            icon.className = 'fa-solid fa-circle-exclamation';
        } else {
            toast.classList.remove('error');
            icon.className = 'fa-solid fa-circle-check';
        }
        
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3000);
    }

    // حالة التحميل للأزرار
    function setLoading(btnId, isLoading, defaultText) {
        const btn = document.getElementById(btnId);
        if(isLoading) {
            btn.disabled = true;
            btn.dataset.oldText = defaultText || btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner"></i> جاري المعالجة...';
        } else {
            btn.disabled = false;
            btn.innerHTML = btn.dataset.oldText || defaultText;
        }
    }

    // جلب الأكواد من السيرفر
    async function loadCodes() {
        const token = tk();
        if(!token) return;

        try {
            const res = await fetch(`${API}/api/admin/codes`, { 
                headers: {'x-admin-token': token} 
            });
            
            if(res.status === 403) {
                showToast("الرمز السري خاطئ!", true);
                localStorage.removeItem('admin_token');
                return;
            }
            
            allCodes = await res.json();
            filterAndSearch();
        } catch(err) {
            showToast("خطأ في الاتصال بالسيرفر", true);
        }
    }

    // عرض الأكواد في الواجهة
    function renderCodes(codesToRender) {
        const container = document.getElementById('codes-container');
        container.innerHTML = '';

        if (codesToRender.length === 0) {
            container.innerHTML = '<div class="empty-state">لا توجد أكواد لعرضها</div>';
            return;
        }

        codesToRender.forEach(c => {
            // حساب المدة بشكل مقروء
            let durationText = c.duration_hours >= 1 ? `${c.duration_hours} ساعة` : `${Math.round(c.duration_hours * 60)} دقيقة`;
            let statusClass = c.is_active ? 'status-active' : 'status-disabled';
            let statusText = c.is_active ? 'مفعل' : 'معطل';

            const card = document.createElement('div');
            card.className = 'code-card';
            card.innerHTML = `
                <div class="code-info">
                    <div class="key-code">${c.code}</div>
                    <div class="key-meta">
                        <span><i class="fa-regular fa-clock"></i> ${durationText}</span>
                        <span class="status-badge ${statusClass}">
                            <i class="fa-solid fa-circle" style="font-size: 8px;"></i> ${statusText}
                        </span>
                    </div>
                </div>
                <div class="actions">
                    <button class="action-btn btn-copy" onclick="copyCode('${c.code}')" title="نسخ">
                        <i class="fa-regular fa-copy"></i> نسخ
                    </button>
                    <button class="action-btn btn-reset" onclick="resetDevice(${c.id})" title="تجديد/فصل الأجهزة">
                        <i class="fa-solid fa-rotate-right"></i> ريسيت
                    </button>
                    <button class="action-btn btn-del" onclick="del(${c.id})" title="حذف">
                        <i class="fa-solid fa-trash"></i> حذف
                    </button>
                </div>
            `;
            container.appendChild(card);
        });
    }

    // البحث والتصفية
    function setFilter(filter) {
        currentFilter = filter;
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
        filterAndSearch();
    }

    function filterAndSearch() {
        const searchTerm = document.getElementById('searchInput').value.toLowerCase();
        
        const filtered = allCodes.filter(c => {
            const matchesSearch = c.code.toLowerCase().includes(searchTerm);
            const matchesFilter = 
                currentFilter === 'all' ? true :
                currentFilter === 'active' ? c.is_active === 1 : 
                c.is_active === 0;
            
            return matchesSearch && matchesFilter;
        });

        renderCodes(filtered);
    }

    // نسخ الكود
    function copyCode(code) {
        navigator.clipboard.writeText(code).then(() => {
            showToast("تم نسخ الكود بنجاح");
        });
    }

    // إنشاء كود جديد
    async function createCode() {
        const token = tk();
        const durationValue = +document.getElementById('dur').value;
        const timeUnit = document.getElementById('time_unit').value;
        const devices = +document.getElementById('dev').value;
        const count = +document.getElementById('cnt').value;

        if(durationValue <= 0 || devices <= 0 || count <= 0) {
            return showToast("يرجى إدخال قيم صحيحة أكبر من صفر", true);
        }

        // تحويل الدقائق إلى ساعات إذا لزم الأمر
        const durationInHours = timeUnit === 'minutes' ? durationValue / 60 : durationValue;

        const body = { 
            duration_hours: durationInHours, 
            max_devices: devices, 
            count: count 
        };

        setLoading('btn-create', true);
        
        try {
            const res = await fetch(`${API}/api/admin/codes`, { 
                method: 'POST', 
                headers: {'Content-Type': 'application/json', 'x-admin-token': token}, 
                body: JSON.stringify(body) 
            });
            
            if(res.ok) {
                showToast("تم إنشاء الأكواد بنجاح");
                loadCodes(); // إعادة تحميل القائمة
            } else {
                showToast("حدث خطأ أثناء الإنشاء", true);
            }
        } catch(err) {
            showToast("خطأ في الاتصال", true);
        } finally {
            setLoading('btn-create', false, '<i class="fa-solid fa-plus"></i> إنشاء الأكواد');
        }
    }

    // حذف كود واحد
    async function del(id) {
        if(!confirm("هل أنت متأكد من حذف هذا الكود نهائياً؟")) return;
        
        try {
            const res = await fetch(`${API}/api/admin/codes/${id}`, { 
                method: 'DELETE', 
                headers: {'x-admin-token': tk()} 
            });
            if(res.ok) {
                showToast("تم حذف الكود");
                loadCodes();
            }
        } catch(err) {
            showToast("حدث خطأ أثناء الحذف", true);
        }
    }

    // إعادة تعيين الأجهزة (Reset)
    async function resetDevice(id) {
        if(!confirm("هل أنت متأكد من إعادة تعيين هذا المفتاح؟ سيتم فصل الأجهزة المرتبطة به.")) return;
        
        try {
            const res = await fetch(`${API}/api/admin/codes/${id}/reset`, { 
                method: 'DELETE', 
                headers: {'x-admin-token': tk()} 
            });
            if(res.ok) {
                showToast("تم إعادة تعيين المفتاح بنجاح");
            } else {
                showToast("حدث خطأ أثناء إعادة التعيين", true);
            }
        } catch(err) {
            showToast("خطأ في الاتصال", true);
        }
    }

    // حذف جميع الأكواد
    async function deleteAllCodes() {
        if(!confirm("تحذير: سيتم حذف جميع الأكواد نهائياً! هل أنت متأكد؟")) return;
        
        try {
            const res = await fetch(`${API}/api/admin/codes`, { headers: {'x-admin-token': tk()} });
            const rows = await res.json();
            
            for (let c of rows) {
                await fetch(`${API}/api/admin/codes/${c.id}`, { 
                    method: 'DELETE', 
                    headers: {'x-admin-token': tk()} 
                });
            }
            showToast("تم حذف جميع الأكواد");
            loadCodes();
        } catch (err) {
            showToast("حدث خطأ أثناء الحذف", true);
        }
    }

    // تشغيل جلب الأكواد عند فتح الصفحة
    window.onload = () => {
        if(localStorage.getItem('admin_token')) {
            loadCodes();
        } else {
            setTimeout(() => { if(tk()) loadCodes(); }, 100);
        }
    };
</script>
</body>
</html>
