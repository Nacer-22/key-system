<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control panel Nacer_22</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
    body { 
        background-color: #050000;
        background-image: radial-gradient(circle at 50% 0%, rgba(139, 0, 0, 0.2) 0%, transparent 60%);
        color: #fff; display: flex; justify-content: center; align-items: flex-start;
        min-height: 100vh; padding: 20px; padding-top: 40px;
    }
    .container { 
        width: 100%; max-width: 700px; background: rgba(10, 0, 0, 0.9); 
        padding: 30px; border-radius: 12px; border: 1px solid #e50914; 
        text-align: center; box-shadow: 0 0 20px rgba(229, 9, 20, 0.2);
    }
    img.logo { width: 100px; height: 100px; border-radius: 50%; border: 3px solid #e50914; box-shadow: 0 0 15px rgba(229, 9, 20, 0.5); margin-bottom: 10px; object-fit: cover;}
    h1 { color: #e50914; font-size: 24px; margin-bottom: 25px; text-shadow: 0 0 10px rgba(229,9,20,0.5); }
    .card { background: rgba(20, 5, 5, 0.8); padding: 15px; border-radius: 8px; margin-bottom: 20px; border-right: 3px solid #e50914; border-left: 1px solid #333; border-top: 1px solid #333; border-bottom: 1px solid #333; }
    input { width: 100%; padding: 12px; margin: 5px 0; border-radius: 6px; border: 1px solid #444; background: #000; color: #fff; font-size: 16px; outline: none; transition: 0.3s; }
    input:focus { border-color: #e50914; box-shadow: 0 0 10px rgba(229,9,20,0.3); }
    button { width: 100%; padding: 12px; margin: 5px 0; border-radius: 6px; border: 1px solid #ff1a1a; background: linear-gradient(180deg, #cc0000 0%, #550000 100%); color: #fff; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.3s; display: flex; justify-content: center; align-items: center; gap: 8px; }
    button:hover { transform: scale(1.02); box-shadow: 0 0 15px rgba(255,0,0,0.4); }
    button:active { transform: scale(0.98); }
    .btn-danger { background: linear-gradient(180deg, #550000 0%, #220000 100%); border-color: #880000; }
    .row { display: flex; gap: 10px; }
    .row input { flex: 1; text-align: center; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
    th, td { padding: 12px 8px; border-bottom: 1px solid #333; text-align: center; }
    th { color: #e50914; border-bottom: 2px solid #e50914; font-weight: bold; }
    .code-cell { font-family: monospace; font-size: 16px; color: #ffcc00; }
    .action-btn { background: #333; border: 1px solid #555; padding: 6px 10px; border-radius: 4px; color: #fff; cursor: pointer; font-size: 12px; width: auto; display: inline-flex; }
    .action-btn:hover { background: #555; }
    .btn-copy { background: #1e3a8a; border-color: #3b82f6; }
    .btn-copy:hover { background: #2563eb; }
    .btn-reset { background: #854d0e; border-color: #eab308; }
    .btn-reset:hover { background: #ca8a04; }
    #status { color: #22c55e; font-weight: bold; display: none; margin-bottom: 15px; }
    #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #22c55e; color: #fff; padding: 10px 20px; border-radius: 5px; font-weight: bold; display: none; z-index: 1000; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
</style>
</head>
<body>

<div class="container">
    <!-- تم استخدام رابط مستقر لصورة الجمجمة هنا -->
    <img src="https://i.imgur.com/lbr98b.png" alt="Logo" class="logo">
    <h1>Control panel Nacer_22</h1>

    <div class="card">
        <input type="password" id="token" placeholder="أدخل الرمز السري (Admin Token)">
        <button onclick="loadCodes()"><i class="fa-solid fa-download"></i> تحميل الأكواد</button>
    </div>

    <div class="card">
        <div class="row">
            <input type="number" id="dur" value="24" placeholder="المدة">
            <input type="number" id="dev" value="1" placeholder="الأجهزة">
            <input type="number" id="cnt" value="1" placeholder="العدد">
        </div>
        <button onclick="createCode()"><i class="fa-solid fa-plus"></i> إنشاء الأكواد</button>
    </div>

    <div id="status"></div>

    <div id="table-container" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <h3 style="color: #fff; font-size: 18px;">الأكواد المسجلة</h3>
            <button class="btn-danger" onclick="deleteAllCodes()" style="width: auto; padding: 8px 15px; font-size: 13px;">
                <i class="fa-solid fa-trash"></i> حذف الكل
            </button>
        </div>
        
        <table>
            <thead>
                <tr><th>ID</th><th>الكود</th><th>المدة</th><th>الحالة</th><th>إجراءات</th></tr>
            </thead>
            <tbody id="tbody"></tbody>
        </table>
    </div>
</div>

<div id="toast">تم نسخ الكود!</div>

<script>
    const API = "https://key-system-yn0o.onrender.com"; 
    const tk = () => document.getElementById('token').value;
    const st = document.getElementById('status');

    function showStatus(msg) { st.innerText = msg; st.style.display = 'block'; setTimeout(() => st.style.display = 'none', 3000); }
    function showToast(msg) { const toast = document.getElementById('toast'); toast.innerText = msg; toast.style.display = 'block'; setTimeout(() => { toast.style.display = 'none'; }, 2500); }

    async function createCode() {
        const body = { duration_hours: +document.getElementById('dur').value, max_devices: +document.getElementById('dev').value, count: +document.getElementById('cnt').value };
        const r = await fetch(API + '/api/admin/codes', { method: 'POST', headers: {'Content-Type': 'application/json', 'x-admin-token': tk()}, body: JSON.stringify(body) });
        if(r.status === 403) return showStatus("الرمز السري خاطئ!");
        showStatus("تم الإنشاء بنجاح!"); loadCodes();
    }

    async function loadCodes() {
        const r = await fetch(API + '/api/admin/codes', { headers: {'x-admin-token': tk()} });
        if(r.status === 403) return showStatus("الرمز السري خاطئ!");
        const rows = await r.json();
        document.getElementById('table-container').style.display = 'block';
        
        document.getElementById('tbody').innerHTML = rows.map(c => `
            <tr>
                <td>${c.id}</td>
                <td class="code-cell">${c.code}</td>
                <td>${c.duration_hours}</td>
                <td style="color:${c.is_active ? '#22c55e' : '#e50914'}; font-weight: bold;">${c.is_active ? 'مفعل' : 'معطل'}</td>
                <td>
                    <div style="display: flex; gap: 5px; justify-content: center; flex-wrap: wrap;">
                        <button class="action-btn btn-copy" onclick="copyCode('${c.code}')"><i class="fa-regular fa-copy"></i> نسخ</button>
                        <button class="action-btn btn-reset" onclick="resetDevice(${c.id})"><i class="fa-solid fa-rotate-right"></i> ريسيت</button>
                        <button class="action-btn" style="background: #7f1d1d;" onclick="del(${c.id})"><i class="fa-solid fa-trash"></i> حذف</button>
                    </div>
                </td>
            </tr>
        `).join('');
    }

    async function del(id) {
        if(!confirm("هل أنت متأكد من حذف هذا الكود؟")) return;
        await fetch(API + '/api/admin/codes/' + id, { method: 'DELETE', headers: {'x-admin-token': tk()} });
        loadCodes();
    }

    // دالة إعادة تعيين الجهاز (Reset)
    async function resetDevice(id) {
        if(!confirm("هل أنت متأكد من إعادة تعيين هذا المفتاح؟ سيتم فصل الأجهزة الحالية ليتمكن جهاز جديد من استخدامه.")) return;
        const r = await fetch(API + '/api/admin/codes/' + id + '/reset', { method: 'DELETE', headers: {'x-admin-token': tk()} });
        if(r.ok) { showToast("✅ تم إعادة تعيين المفتاح بنجاح"); loadCodes(); }
        else { alert("حدث خطأ أثناء إعادة التعيين"); }
    }

    async function deleteAllCodes() {
        if(!confirm("هل أنت متأكد من حذف جميع الأكواد؟ لا يمكن التراجع!")) return;
        try {
            const r = await fetch(API + '/api/admin/codes', { headers: {'x-admin-token': tk()} });
            const rows = await r.json();
            for (let c of rows) { await fetch(API + '/api/admin/codes/' + c.id, { method: 'DELETE', headers: {'x-admin-token': tk()} }); }
            showToast("🗑️ تم حذف جميع الأكواد"); loadCodes();
        } catch (err) { alert("حدث خطأ أثناء الحذف"); }
    }

    function copyCode(code) {
        navigator.clipboard.writeText(code).then(() => { showToast("✅ تم نسخ الكود: " + code); });
    }
</script>
</body>
</html>
