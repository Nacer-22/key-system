<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Control panel Nacer_22</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    /* === الألوان الأصلية === */
    :root {
        --primary-red: #e50914;
        --primary-hover: #ff1a25;
        --dark-red: #8b0000;
        --bg-dark: #050000;
        --card-bg: rgba(15, 5, 5, 0.85);
        --gold: #ffcc00;
        --text-main: #ffffff;
        --text-muted: #9ca3af;
        --success: #22c55e;
        --error: #ef4444;
        --info: #3b82f6;
        --border-color: rgba(229, 9, 20, 0.2);
        --sidebar-width: 260px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
    
    body { 
        background-color: var(--bg-dark);
        color: var(--text-main); 
        min-height: 100vh;
        font-size: 14px; line-height: 1.5;
        overflow-x: hidden;
    }

    /* === هيكل لوحة التحكم (Layout) === */
    .app-layout {
        display: flex;
        min-height: 100vh;
    }

    /* --- الشريط الجانبي (Sidebar) --- */
    .sidebar {
        width: var(--sidebar-width);
        background: rgba(10, 2, 2, 0.95);
        border-left: 1px solid var(--border-color);
        display: flex;
        flex-direction: column;
        padding: 20px 0;
        position: fixed;
        top: 0; right: 0; bottom: 0;
        z-index: 100;
        transition: all 0.3s;
    }

    .brand-section {
        display: flex; flex-direction: column; align-items: center;
        padding: 0 20px 20px 20px;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        margin-bottom: 20px;
    }
    .brand-section img {
        width: 70px; height: 70px; border-radius: 50%;
        border: 2px solid var(--primary-red);
        box-shadow: 0 0 15px rgba(229, 9, 20, 0.4);
        margin-bottom: 10px; background: #000; object-fit: cover;
    }
    .brand-section h1 { font-size: 20px; font-weight: 900; color: #fff; text-align: center;}
    .brand-section h1 span { color: var(--primary-red); }

    .nav-menu { display: flex; flex-direction: column; gap: 5px; padding: 0 15px; }
    .nav-item {
        display: flex; align-items: center; gap: 12px;
        padding: 12px 15px; border-radius: 8px;
        color: var(--text-muted); text-decoration: none;
        font-weight: 700; font-size: 14px;
        transition: all 0.3s;
    }
    .nav-item:hover, .nav-item.active {
        background: rgba(229, 9, 20, 0.1);
        color: #fff;
        border-right: 3px solid var(--primary-red);
    }
    .nav-item i { width: 20px; text-align: center; font-size: 16px; }

    /* --- منطقة المحتوى الرئيسية --- */
    .main-content {
        flex: 1;
        margin-right: var(--sidebar-width);
        padding: 20px 25px;
        background-image: radial-gradient(circle at 50% 0%, rgba(139, 0, 0, 0.15) 0%, transparent 60%);
        display: flex; flex-direction: column; gap: 20px;
    }

    /* --- قسم الدخول --- */
    #login-section {
        background: rgba(0, 0, 0, 0.6); padding: 15px 20px; border-radius: 10px;
        border: 1px solid var(--border-color); max-width: 400px; margin: 50px auto;
        text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }
    .input-row { display: flex; gap: 10px; margin-top: 15px;}
    
    /* === الحقول والأزرار === */
    input, select { 
        width: 100%; padding: 10px 12px; border-radius: 6px; border: 1px solid #333; 
        background: #050505; color: #fff; font-size: 14px; outline: none; 
        font-family: 'Cairo', sans-serif; transition: all 0.3s ease;
    }
    input:focus, select:focus { border-color: var(--primary-red); box-shadow: 0 0 8px rgba(229, 9, 20, 0.3); }

    button { 
        padding: 10px 15px; border-radius: 6px; border: none; 
        background: linear-gradient(180deg, var(--primary-red) 0%, var(--dark-red) 100%); 
        color: #fff; font-weight: 900; font-size: 14px; cursor: pointer; 
        transition: all 0.2s ease; display: inline-flex; justify-content: center; align-items: center; gap: 6px;
        box-shadow: 0 2px 10px rgba(229, 9, 20, 0.3);
    }
    button:hover:not(:disabled) { background: linear-gradient(180deg, var(--primary-hover) 0%, #a00000 100%); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    /* === البطاقات الإدارية === */
    .panel-card { 
        background: var(--card-bg); 
        border: 1px solid rgba(255, 255, 255, 0.05); 
        border-radius: 10px; 
        padding: 20px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .panel-header { 
        display: flex; justify-content: space-between; align-items: center;
        margin-bottom: 15px; padding-bottom: 10px;
        border-bottom: 1px solid rgba(229, 9, 20, 0.15);
    }
    .panel-title { font-size: 16px; font-weight: 900; color: #fff; display: flex; align-items: center; gap: 8px; }
    .panel-title i { color: var(--primary-red); }

    /* === قسم الإنشاء (مضغوط) === */
    .create-form {
        display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 10px; align-items: end;
    }
    .input-group { display: flex; flex-direction: column; gap: 5px; }
    .input-group label { font-size: 12px; color: var(--text-muted); font-weight: 700; }
    
    /* === بطاقة الكود (مضغوطة جداً) === */
    .key-list { display: flex; flex-direction: column; gap: 8px; }
    
    .key-row { 
        display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
        background: rgba(0, 0, 0, 0.4); border: 1px solid #222; border-radius: 8px;
        padding: 10px 15px; gap: 10px;
        transition: 0.3s;
    }
    .key-row:hover { border-color: rgba(229, 9, 20, 0.3); background: rgba(20, 5, 5, 0.6); }

    .key-main-info { display: flex; align-items: center; gap: 15px; flex: 1; min-width: 200px;}
    .key-code { font-family: monospace; font-size: 16px; color: var(--gold); font-weight: 900; direction: ltr; }
    
    .key-badge { padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
    .badge-active { background: rgba(34, 197, 94, 0.15); color: var(--success); border: 1px solid rgba(34, 197, 94, 0.3); }
    .badge-disabled { background: rgba(239, 68, 68, 0.15); color: var(--error); border: 1px solid rgba(239, 68, 68, 0.3); }

    .key-stats { 
        display: flex; gap: 15px; font-size: 12px; color: var(--text-muted); flex-wrap: wrap;
    }
    .key-stats span { display: flex; align-items: center; gap: 5px; }

    .key-actions-compact { display: flex; gap: 6px; }
    .key-actions-compact button { padding: 6px 10px; font-size: 12px; border-radius: 5px; }
    
    .btn-blue { background: #1e3a8a; box-shadow: none; }
    .btn-blue:hover:not(:disabled) { background: #2563eb; }
    .btn-gold { background: #854d0e; box-shadow: none; }
    .btn-gold:hover:not(:disabled) { background: #ca8a04; }
    .btn-del { background: #7f1d1d; box-shadow: none; }
    .btn-del:hover:not(:disabled) { background: #b91c1c; }
    .btn-dark { background: #333; border: 1px solid #444; box-shadow: none; }
    .btn-dark:hover:not(:disabled) { background: #444; }

    /* === البحث والرسائل === */
    .search-input { max-width: 300px; position: relative; }
    .search-input input { padding-right: 35px; }
    .search-input i { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: #666; }

    #status-msg { 
        color: var(--success); font-weight: bold; display: none; 
        font-size: 13px; padding: 10px 15px; border-radius: 6px; 
        background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.2); 
        margin-top: 10px; text-align: center;
    }

    /* === التجاوب مع الهاتف (Mobile Responsive) === */
    @media (max-width: 768px) {
        .app-layout { flex-direction: column; }
        
        /* تحويل الشريط الجانبي إلى شريط علوي مضغوط */
        .sidebar {
            position: relative; width: 100%; height: auto;
            flex-direction: row; padding: 10px; border-left: none; border-bottom: 1px solid var(--border-color);
            justify-content: space-between; align-items: center;
        }
        .brand-section { flex-direction: row; padding: 0; border: none; margin: 0; gap: 10px; }
        .brand-section img { width: 40px; height: 40px; margin: 0; border-width: 1px; }
        .brand-section h1 { font-size: 16px; text-align: right; }
        
        .nav-menu { display: none; } /* إخفاء القائمة في الهاتف لتوفير المساحة */
        
        .main-content { margin-right: 0; padding: 15px; }
        #login-section { margin: 20px auto; }
        
        .key-row { flex-direction: column; align-items: flex-start; gap: 10px; padding: 15px; }
        .key-main-info { width: 100%; justify-content: space-between; }
        .key-stats { width: 100%; justify-content: space-between; padding-top: 10px; border-top: 1px dashed #333; }
        .key-actions-compact { width: 100%; justify-content: flex-end; margin-top: 5px;}
        .key-actions-compact button { flex: 1; }
        
        .create-form { grid-template-columns: 1fr 1fr; }
        .create-form button { grid-column: span 2; }
    }
    
    .fa-spinner { animation: spin 1s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="app-layout">
    
    <!-- 1. الشريط الجانبي (يتحول لشريط علوي في الهاتف) -->
    <aside class="sidebar">
        <div class="brand-section">
            <img src="https://i.imgur.com/kf1AmpO.png" alt="Logo">
            <h1>Control <span>Nacer_22</span></h1>
        </div>
        <div class="nav-menu">
            <a href="#" class="nav-item active"><i class="fa-solid fa-gauge-high"></i> لوحة التحكم</a>
            <a href="#" class="nav-item"><i class="fa-solid fa-key"></i> الأكواد</a>
            <a href="#" class="nav-item"><i class="fa-solid fa-gear"></i> الإعدادات</a>
        </div>
    </aside>

    <!-- 2. المحتوى الرئيسي -->
    <main class="main-content">
        
        <!-- قسم الدخول -->
        <div id="login-section">
            <h3 style="color:#e50914; margin-bottom:10px;"><i class="fa-solid fa-lock"></i> الدخول للوحة</h3>
            <div class="input-row">
                <input type="password" id="tokenInput" placeholder="أدخل كلمة المرور" onkeypress="handleKeyPress(event)">
                <button onclick="login()">دخول</button>
            </div>
            <div id="login-error" style="color:var(--error); font-size:13px; margin-top:10px; display:none; font-weight:bold;">كلمة المرور غير صحيحة!</div>
        </div>

        <!-- محتوى لوحة التحكم -->
        <div id="dashboard-content" style="display: none; display: flex; flex-direction: column; gap: 20px;">
            
            <!-- قسم الإنشاء (مضغوط) -->
            <div class="panel-card">
                <div class="panel-header">
                    <div class="panel-title"><i class="fa-solid fa-plus-circle"></i> إنشاء أكواد جديدة</div>
                </div>
                <div class="create-form">
                    <div class="input-group">
                        <label>المدة</label>
                        <input type="number" id="dur" value="24" min="1">
                    </div>
                    <div class="input-group">
                        <label>الوحدة</label>
                        <select id="time_unit">
                            <option value="hours">ساعة</option>
                            <option value="days">يوم</option>
                            <option value="weeks">أسبوع</option>
                            <option value="months">شهر</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>العدد</label>
                        <input type="number" id="cnt" value="1" min="1">
                    </div>
                    <div class="input-group">
                        <label>الأجهزة</label>
                        <input type="number" id="dev" value="1" min="1">
                    </div>
                    <div class="input-group">
                        <button onclick="createCode()" id="btn-create" style="width:100%;"><i class="fa-solid fa-bolt"></i> إنشاء</button>
                    </div>
                </div>
            </div>

            <!-- قسم عرض الأكواد -->
            <div class="panel-card">
                <div class="panel-header">
                    <div class="panel-title"><i class="fa-solid fa-list-ul"></i> الأكواد المسجلة</div>
                    <button class="btn-dark" style="padding: 6px 12px; font-size: 12px;" onclick="confirmDeleteAll()"><i class="fa-solid fa-trash"></i> حذف الكل</button>
                </div>
                
                <div style="margin-bottom: 15px;">
                    <div class="search-input">
                        <input type="text" id="searchInput" placeholder="ابحث عن كود..." oninput="filterCodes()">
                        <i class="fa-solid fa-search"></i>
                    </div>
                </div>

                <div class="key-list" id="codes-container">
                    <!-- سيتم تعبئتها ديناميكياً -->
                </div>
            </div>

            <div id="status-msg"></div>
        </div>
    </main>
</div>

<script>
    // ⚠️ لم يتم تغيير أي متغير أو رابط سيرفر ⚠️
    const API = "https://key-system-yn0o.onrender.com"; 
    const SECRET_PASSWORD = "Nacer_Nacer_22";
    let adminToken = "";
    let allCodes = [];

    function handleKeyPress(e) {
        if (e.key === 'Enter') login();
    }

    function login() {
        const inputVal = document.getElementById('tokenInput').value.trim();
        const errorMsg = document.getElementById('login-error');

        if (inputVal === SECRET_PASSWORD) {
            errorMsg.style.display = 'none';
            adminToken = inputVal;
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('dashboard-content').style.display = 'flex';
            fetchCodes();
        } else {
            errorMsg.style.display = 'block';
        }
    }

    function showMsg(msg, isError = false) {
        const status = document.getElementById('status-msg');
        status.innerText = msg;
        status.style.color = isError ? "var(--error)" : "var(--success)";
        status.style.background = isError ? "rgba(239,68,68,0.1)" : "rgba(34,197,94,0.1)";
        status.style.borderColor = isError ? "rgba(239,68,68,0.2)" : "rgba(34,197,94,0.2)";
        status.style.display = 'block';
        setTimeout(() => { status.style.display = 'none'; }, 4000);
    }

    async function fetchCodes() {
        try {
            const res = await fetch(`${API}/api/admin/codes`, { headers: {'x-admin-token': adminToken} });
            if(res.ok) {
                allCodes = await res.json();
                renderCodes(allCodes);
            }
        } catch(err) {
            showMsg("تعذر جلب البيانات (السيرفر قد يكون نائماً).", true);
        }
    }

    function renderCodes(codesToRender) {
        const container = document.getElementById('codes-container');
        container.innerHTML = '';

        if (codesToRender.length === 0) {
            container.innerHTML = '<div style="text-align:center; color:#666; padding:20px; font-weight:bold;">لا توجد أكواد حالياً</div>';
            return;
        }

        codesToRender.forEach(c => {
            let durationText = c.duration_hours >= 1 ? `${c.duration_hours} ساعة` : `${Math.round(c.duration_hours * 60)} دقيقة`;
            let isActive = c.is_active === 1;
            let badgeClass = isActive ? 'badge-active' : 'badge-disabled';
            let badgeText = isActive ? 'مفعل' : 'معطل';

            const card = document.createElement('div');
            card.className = 'key-row';
            card.innerHTML = `
                <div class="key-main-info">
                    <div class="key-code">${c.code}</div>
                    <div class="key-badge ${badgeClass}">${badgeText}</div>
                </div>
                <div class="key-stats">
                    <span><i class="fa-regular fa-clock"></i> ${durationText}</span>
                    <span><i class="fa-solid fa-mobile-screen"></i> أجهزة: ${c.max_devices}</span>
                    <span><i class="fa-solid fa-users"></i> مستخدم: ${c.used}</span>
                </div>
                <div class="key-actions-compact">
                    <button class="btn-blue" onclick="copyCode('${c.code}')" title="نسخ"><i class="fa-regular fa-copy"></i></button>
                    <button class="btn-gold" onclick="resetDevice(${c.id})" title="ريسيت"><i class="fa-solid fa-rotate-right"></i></button>
                    <button class="btn-del" onclick="deleteCode(${c.id})" title="حذف"><i class="fa-solid fa-trash"></i></button>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function filterCodes() {
        const term = document.getElementById('searchInput').value.toLowerCase();
        const filtered = allCodes.filter(c => c.code.toLowerCase().includes(term));
        renderCodes(filtered);
    }

    async function createCode() {
        const btn = document.getElementById('btn-create');
        const originalHTML = btn.innerHTML;
        
        const dur = +document.getElementById('dur').value;
        const unit = document.getElementById('time_unit').value;
        const count = +document.getElementById('cnt').value;
        const devices = +document.getElementById('dev').value;

        if(dur <= 0 || count <= 0 || devices <= 0) {
            return showMsg("يرجى إدخال قيم صحيحة أكبر من صفر", true);
        }

        let hours = dur;
        if (unit === 'days') hours *= 24;
        if (unit === 'weeks') hours *= 168;
        if (unit === 'months') hours *= 720;

        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';

        try {
            const res = await fetch(`${API}/api/admin/codes`, { 
                method: 'POST', 
                headers: {'Content-Type': 'application/json', 'x-admin-token': adminToken}, 
                body: JSON.stringify({ duration_hours: hours, max_devices: devices, count: count }) 
            });
            
            if(res.ok) {
                showMsg(`تم إنشاء ${count} مفاتيح بنجاح`);
                document.getElementById('cnt').value = "1";
                fetchCodes();
            } else {
                showMsg("حدث خطأ أثناء الإنشاء", true);
            }
        } catch(err) {
            showMsg("تعذر الاتصال بالسيرفر", true);
        } finally {
            btn.disabled = false;
            btn.innerHTML = originalHTML;
        }
    }

    function copyCode(code) {
        navigator.clipboard.writeText(code).then(() => {
            showMsg("تم نسخ الكود: " + code);
        });
    }

    async function deleteCode(id) {
        if(!confirm("هل أنت متأكد من حذف هذا الكود؟")) return;
        try {
            await fetch(`${API}/api/admin/codes/${id}`, { method: 'DELETE', headers: {'x-admin-token': adminToken} });
            fetchCodes();
        } catch(e) { showMsg("حدث خطأ", true); }
    }

    async function resetDevice(id) {
        if(!confirm("هل أنت متأكد من إعادة تعيين هذا المفتاح (فصل الأجهزة)؟")) return;
        try {
            await fetch(`${API}/api/admin/codes/${id}/reset`, { method: 'DELETE', headers: {'x-admin-token': adminToken} });
            showMsg("تم إعادة التعيين بنجاح");
        } catch(e) { showMsg("حدث خطأ", true); }
    }

    async function confirmDeleteAll() {
        if(!confirm("تحذير: سيتم حذف جميع الأكواد نهائياً! هل أنت متأكد؟")) retu
